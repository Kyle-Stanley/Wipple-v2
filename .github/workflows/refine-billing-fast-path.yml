name: Refine billing fast path

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: billing-motif-fast-path
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply refinement
        run: python tools/refine_billing_fast_path.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest scipy
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Commit clean refinement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/refine-billing-fast-path.yml tools/refine_billing_fast_path.py
          git add wipple/accounting/wip.py tests/test_billing_motif_fast_path.py
          git commit -m "Bound the billing motif fast pass"
          git push origin HEAD:billing-motif-fast-path
