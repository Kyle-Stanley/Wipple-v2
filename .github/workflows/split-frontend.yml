name: Tighten frontend state semantics

on:
  pull_request:
    paths:
      - static/app/01-app-state.js
      - static/app/30-document.js
      - .github/workflows/split-frontend.yml

permissions:
  contents: write

jobs:
  tighten:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Remove misleading state helpers
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new)

          state_path = Path('static/app/01-app-state.js')
          state = state_path.read_text(encoding='utf-8')
          state = replace_once(
              state,
              '    get report(){return this.sections[this.activeSection]?.rep||null;},\n    get accepted(){',
              '    get report(){return this.sections[this.activeSection]?.rep||null;},\n    // Each section owns one persistent correction Set. Reading this getter\n    // lazily creates a missing slot so callers always receive that section\'s Set.\n    get accepted(){',
              'accepted getter comment',
          )
          state = replace_once(
              state,
              'function activateDocumentSection(index,{saveCurrent=true,view="certificate"}={}){\n  const session=APP_STATE.document;\n  if(!session.sections[index])return false;\n  if(saveCurrent&&session.correctionsBySection[session.activeSection])\n    session.correctionsBySection[session.activeSection]=new Set(session.accepted);\n  session.activeSection=index;\n  session.view=view;\n  void session.accepted;\n  return true;\n}',
              'function activateDocumentSection(index,{view="certificate"}={}){\n  const session=APP_STATE.document;\n  if(!session.sections[index])return false;\n  session.activeSection=index;\n  session.view=view;\n  void session.accepted;\n  return true;\n}',
              'section activation semantics',
          )
          state = replace_once(
              state,
              '\nfunction activeCorrectionStateIsAliased(){\n  const session=APP_STATE.document;\n  return session.accepted===session.correctionsBySection[session.activeSection];\n}\n',
              '\n',
              'tautological alias helper',
          )
          state_path.write_text(state.rstrip() + '\n', encoding='utf-8')

          document_path = Path('static/app/30-document.js')
          document = document_path.read_text(encoding='utf-8')
          document = replace_once(
              document,
              'activateDocumentSection(sectionIndex,{saveCurrent:false,view:APP_STATE.document.view})',
              'activateDocumentSection(sectionIndex,{view:APP_STATE.document.view})',
              'mapping activation call',
          )
          document = replace_once(
              document,
              'activateDocumentSection(APP_STATE.document.activeSection,{saveCurrent:false})',
              'activateDocumentSection(APP_STATE.document.activeSection)',
              'validation activation call',
          )
          document_path.write_text(document, encoding='utf-8')
          PY

          for file in static/app/*.js; do
            node --check "$file"
          done
          cat static/app/*.js > /tmp/wipple-app.js
          node --check /tmp/wipple-app.js
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/app/01-app-state.js static/app/30-document.js
          git commit -m "clarify section correction persistence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
