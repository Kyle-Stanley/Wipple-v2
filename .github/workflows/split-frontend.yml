name: Frontend split integrity

on:
  push:
    branches:
      - frontend-cleanup
    paths:
      - static/index.html
      - static/styles/**
      - static/app/**
      - scripts/split_frontend.py
      - .github/workflows/split-frontend.yml
  pull_request:
    paths:
      - static/index.html
      - static/styles/**
      - static/app/**
      - scripts/split_frontend.py
      - .github/workflows/split-frontend.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: frontend-cleanup
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Split frontend when needed
        run: python scripts/split_frontend.py

      - name: Check generated JavaScript syntax
        run: |
          for file in static/app/*.js; do
            node --check "$file"
          done
          cat static/app/*.js > /tmp/wipple-app.js
          node --check /tmp/wipple-app.js

      - name: Verify exact source preservation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          style_pattern = re.compile(r'<style>\s*(.*?)\s*</style>', re.DOTALL)
          original = subprocess.check_output(
              ['git', 'show', 'origin/main:static/index.html'], text=True
          )
          anchor = original.index('<script src="/static/job_matching.js"></script>')
          original_markup = original[:anchor]
          original_tail = original[anchor:]

          styles = style_pattern.findall(original_markup)
          assert len(styles) == 2
          expected_css = styles[0] + '\n\n' + styles[1] + '\n'
          actual_css = Path('static/styles/wipple.css').read_text(encoding='utf-8')
          assert actual_css == expected_css

          wip_math = original_tail.index('<script src="/static/wip_math.js"></script>')
          inline_start = original_tail.index('<script>', wip_math) + len('<script>')
          inline_end = original_tail.rindex('</script>')
          expected_js = original_tail[inline_start:inline_end]
          if expected_js.startswith('\n'):
              expected_js = expected_js[1:]
          if expected_js.endswith('\n'):
              expected_js = expected_js[:-1]

          app_files = sorted(Path('static/app').glob('*.js'))
          actual_js = ''.join(path.read_text(encoding='utf-8') for path in app_files)
          assert actual_js == expected_js
          PY

      - name: Verify slim entry point
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path('static/index.html').read_text(encoding='utf-8')
          assert '<link rel="stylesheet" href="/static/styles/wipple.css">' in html
          assert '<script src="/static/app/00-core.js"></script>' in html
          assert '<script src="/static/app/60-printing.js"></script>' in html
          assert '<style>' not in html
          assert '<script>' not in html
          PY

      - name: Commit generated frontend assets
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/index.html static/styles/wipple.css static/app FRONTEND_ARCHITECTURE.md
          git commit -m "Split frontend monolith into ordered assets"
          git push
