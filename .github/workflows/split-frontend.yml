name: Frontend integrity

on:
  push:
    branches:
      - main
    paths:
      - static/index.html
      - static/styles/**
      - static/app/**
      - .github/workflows/split-frontend.yml
  pull_request:
    paths:
      - static/index.html
      - static/styles/**
      - static/app/**
      - .github/workflows/split-frontend.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check JavaScript syntax
        run: |
          for file in static/app/*.js; do
            node --check "$file"
          done
          cat static/app/*.js > /tmp/wipple-app.js
          node --check /tmp/wipple-app.js

      - name: Audit frontend state ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          names = [
              'ACCEPTED', 'ACTIVE', 'ANALYSIS_SCOPE', 'BATCH_ACTIVE',
              'BATCH_ANALYSIS_MODE', 'BILLING_TRAJECTORY_SHOW_ALL', 'DOC',
              'DOTS', 'LATEST_PROGRESS', 'MATCH_STATE', 'REPORT', 'RUNNING',
              'SECSTATE', 'SECTIONS', 'VIEW',
          ]
          assignment = re.compile(
              rf'(?<![.$\w])(?:{'|'.join(names)})\s*(?:\+\+|--|[+\-*/%]?=(?!=))'
          )
          declaration = re.compile(
              rf'\b(?:let|const|var)\s+(?:[^;\n]*?\b)?(?:{'|'.join(names)})\b'
          )

          print('STATE_OWNERSHIP_AUDIT_BEGIN')
          for path in sorted(Path('static/app').glob('*.js')):
              lines = path.read_text(encoding='utf-8').splitlines()
              for number, line in enumerate(lines, 1):
                  if assignment.search(line) or declaration.search(line):
                      print(f'{path}:{number}: {line.strip()}')
          print('STATE_OWNERSHIP_AUDIT_END')
          PY

      - name: Verify frontend asset structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          html_path = Path('static/index.html')
          html = html_path.read_text(encoding='utf-8')
          app_files = sorted(Path('static/app').glob('*.js'))
          expected_refs = [f'/static/app/{path.name}' for path in app_files]
          actual_refs = re.findall(r'<script src="(/static/app/[^"]+)"></script>', html)

          assert Path('static/styles/wipple.css').is_file()
          assert '<link rel="stylesheet" href="/static/styles/wipple.css">' in html
          assert actual_refs == expected_refs
          assert '<style>' not in html
          assert '<script>' not in html

          inline_attribute = re.compile(
              r'''<[A-Za-z][^>]*?\b(?P<attribute>on[a-z][a-z0-9]*\s*=\s*["'])''',
              re.IGNORECASE | re.DOTALL,
          )
          inline_handlers = []
          frontend_sources = [html_path, *Path('static').rglob('*.js')]
          for path in frontend_sources:
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              for match in inline_attribute.finditer(text):
                  line_number = text.count('\n', 0, match.start('attribute')) + 1
                  line = lines[line_number - 1].strip() if lines else ''
                  inline_handlers.append(f'{path}:{line_number}: {line}')
          assert not inline_handlers, 'Inline event attributes found:\n' + '\n'.join(inline_handlers)

          original = subprocess.check_output(
              ['git', 'show', 'origin/main:static/index.html'], text=True
          )
          if '<script>' in original:
              style_pattern = re.compile(r'<style>\s*(.*?)\s*</style>', re.DOTALL)
              anchor = original.index('<script src="/static/job_matching.js"></script>')
              original_markup = original[:anchor]
              original_tail = original[anchor:]

              styles = style_pattern.findall(original_markup)
              assert len(styles) == 2
              expected_css = styles[0] + '\n\n' + styles[1] + '\n'
              actual_css = Path('static/styles/wipple.css').read_text(encoding='utf-8')
              assert actual_css == expected_css

              wip_math = original_tail.index('<script src="/static/wip_math.js"></script>')
              inline_start = original_tail.index('<script>', wip_math) + len('<script>')
              inline_end = original_tail.rindex('</script>')
              expected_js = original_tail[inline_start:inline_end]
              if expected_js.startswith('\n'):
                  expected_js = expected_js[1:]
              if expected_js.endswith('\n'):
                  expected_js = expected_js[:-1]

              actual_js = ''.join(
                  path.read_text(encoding='utf-8') for path in app_files
              )
              assert actual_js == expected_js
          PY
