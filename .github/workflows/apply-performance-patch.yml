name: apply performance patch

on:
  push:
    branches:
      - optimize-validation-dedup-memo

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-validation-dedup-memo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply patch
        run: python tools/apply_performance_patch.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest scipy pillow reportlab
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Run corpus gates
        run: python -m wipple.support.gates
      - name: Upload patched files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-patch
          path: |
            wipple/accounting/wip.py
            wipple/pipeline/graph.py
            wipple/pipeline/document.py
            tests/test_performance_invariants.py
      - name: Commit optimized pipeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deduplicate validation and memoize grid detection"
          git push origin HEAD:optimize-validation-dedup-memo
