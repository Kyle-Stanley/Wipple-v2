name: Apply demo progress polish
on:
  push:
    branches: [wip-motif-planner]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply progress and timing changes
        run: python tools/apply_demo_progress.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest scipy pillow reportlab
      - name: Run tests and corpus gates
        run: python -m pytest tests/ -q
      - name: Commit clean implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Polish upload progress and CSV timing'
          git push
