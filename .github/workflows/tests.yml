name: tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-validation-dedup-memo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply sequential schema routing
        run: python tools/apply_sequential_schema_patch.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest scipy pillow reportlab
      - name: Run tests and corpus gates
        run: |
          python -m pytest tests/ -q
          python -m wipple.support.gates
      - name: Remove temporary patch scaffolding
        run: |
          rm tools/apply_sequential_schema_patch.py
          rm .github/workflows/apply-sequential-schema-patch.yml
          git checkout origin/main -- .github/workflows/tests.yml
      - name: Commit sequential schema routing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Run CC only when WIP is unresolved"
          git push origin HEAD:optimize-validation-dedup-memo
