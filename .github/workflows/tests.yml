name: tests

on:
  push:
    branches:
      - rework/table-reconstruction
  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest scipy
      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          python -m pytest tests/ -q > pytest.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Record stitching references
        if: always()
        run: grep -R "stitching" -n --exclude-dir=.git . > stitching-references.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-diagnostics
          path: |
            pytest.log
            stitching-references.log
      - name: Fail when pytest failed
        if: steps.tests.outputs.status != '0'
        run: exit 1
