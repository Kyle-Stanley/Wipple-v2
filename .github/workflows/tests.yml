name: tests

on:
  push:
    branches:
      - rework/table-reconstruction
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Apply inline handler cleanup once
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('static/index.html'), *Path('static').rglob('*.js')]
          attr = re.compile(r'\bon[a-z]+\s*=\s*(["\'])', re.I)

          def findings():
              hits = []
              for path in roots:
                  if not path.exists():
                      continue
                  for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                      hits.extend((path, number, line.strip()) for _ in attr.finditer(line))
              return hits

          before = findings()
          if before:
              if len(before) != 7:
                  for path, number, line in before:
                      print(f'{path}:{number}: {line}')
                  raise SystemExit(f'Expected the audited 7 inline handlers, found {len(before)}')

              index = Path('static/index.html')
              text = index.read_text(encoding='utf-8')
              replacements = [
                  ('<img src="/static/logo/logo2_bw.png" alt="wipple" style="height:30px;display:block" onerror="this.outerHTML=\'w<span>i</span>pple\'">', '<img id="headerLogo" src="/static/logo/logo2_bw.png" alt="wipple" style="height:30px;display:block">'),
                  ('<button class="btn" onclick="location.reload()">New scan</button>', '<button class="btn" id="newScan">New scan</button>'),
                  ('<img class="hero-logo" src="/static/logo/wipple-text-logo.png" alt="wipple"\n       onerror="this.onerror=null;this.src=\'/static/logo/logo2_bw.png\'">', '<img class="hero-logo" id="heroLogo" src="/static/logo/wipple-text-logo.png" alt="wipple">'),
                  ('<img src="/static/logo/wipple-text-logo.png" alt="" onerror="this.closest(\'.loader-logo\').classList.add(\'noimg\')">', '<img id="loaderLogoImage" src="/static/logo/wipple-text-logo.png" alt="">'),
                  ('<button class="btn" onclick="location.reload()">Start over</button>', '<button class="btn" id="startOver">Start over</button>'),
              ]
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise SystemExit(f'Expected one index.html match for: {old}')
                  text = text.replace(old, new)
              index.write_text(text, encoding='utf-8')

              core = Path('static/app/00-core.js')
              text = core.read_text(encoding='utf-8')
              anchor = '$("#pick").onclick=()=>$("#file").click();'
              setup = '''const headerLogo=$("#headerLogo");
headerLogo.addEventListener("error",()=>{headerLogo.outerHTML='w<span>i</span>pple';},{once:true});
const heroLogo=$("#heroLogo");
heroLogo.addEventListener("error",()=>{heroLogo.src="/static/logo/logo2_bw.png";},{once:true});
const loaderLogoImage=$("#loaderLogoImage");
loaderLogoImage.addEventListener("error",()=>loaderLogoImage.closest(".loader-logo")?.classList.add("noimg"),{once:true});
const reloadPage=()=>location.reload();
$("#newScan").onclick=reloadPage;
$("#startOver").onclick=reloadPage;

'''
              if text.count(anchor) != 1:
                  raise SystemExit('Could not find the core event-setup anchor')
              core.write_text(text.replace(anchor, setup + anchor), encoding='utf-8')

              validation = Path('static/app/40-validation.js')
              text = validation.read_text(encoding='utf-8')
              old_buttons = '''      ${BATCH_MODE?'<button class="btn" onclick="renderBatch()">← All validations</button>':""}
      <button class="btn primary" onclick="${BATCH_MODE?`renderBatchItemAnalysis(${BATCH_ACTIVE})`:"VIEW='dash';renderDash(REPORT);show('dash');window.scrollTo(0,0)"}">View underwriting analysis</button>'''
              new_buttons = '''      ${BATCH_MODE?'<button class="btn" id="certBackToBatch">← All validations</button>':""}
      <button class="btn primary" id="certViewAnalysis">View underwriting analysis</button>'''
              if text.count(old_buttons) != 1:
                  raise SystemExit('Could not find the validation navigation buttons')
              text = text.replace(old_buttons, new_buttons)
              anchor = '  const ua=$("#useAll"),st=$("#applyStatus"),ap=$("#applySel"),src=$("#reviewSource");'
              setup = '''  const backToBatch=$("#certBackToBatch"),viewAnalysis=$("#certViewAnalysis");
  if(backToBatch)backToBatch.onclick=()=>renderBatch();
  if(viewAnalysis)viewAnalysis.onclick=()=>{
    if(BATCH_MODE)renderBatchItemAnalysis(BATCH_ACTIVE);
    else{VIEW="dash";renderDash(REPORT);show("dash");window.scrollTo(0,0);}
  };
'''
              if text.count(anchor) != 1:
                  raise SystemExit('Could not find the validation listener anchor')
              validation.write_text(text.replace(anchor, setup + anchor), encoding='utf-8')

          after = findings()
          if after:
              for path, number, line in after:
                  print(f'{path}:{number}: {line}')
              raise SystemExit(f'Inline event attributes remain: {len(after)}')
          print('Inline event attributes: 0')
          PY

          for file in static/*.js static/app/*.js; do
            node --check "$file"
          done
          git diff --check

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add static/index.html static/app/00-core.js static/app/40-validation.js
            git commit -m "refactor frontend event handlers"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest scipy pillow reportlab
      - name: Run tests and corpus gates
        id: tests
        continue-on-error: true
        run: |
          set +e
          python -m pytest tests/ -q > pytest.log 2>&1
          pytest_status=$?
          python -m wipple.support.gates > gates.log 2>&1
          gates_status=$?
          set -e
          echo "pytest_status=$pytest_status" >> "$GITHUB_OUTPUT"
          echo "gates_status=$gates_status" >> "$GITHUB_OUTPUT"
      - name: Record deprecated stitching references
        if: always()
        run: grep -R "stitching" -n --exclude-dir=.git . > stitching-references.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-diagnostics
          path: |
            pytest.log
            gates.log
            stitching-references.log
      - name: Fail when validation failed
        if: steps.tests.outputs.pytest_status != '0' || steps.tests.outputs.gates_status != '0'
        run: exit 1
