name: Refine WIP motif planner

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip-motif-planner
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply refinement
        run: python tools/refine_wip_motif_planner.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest scipy pillow reportlab
      - name: Run tests and corpus gates
        run: python -m pytest tests/ -q
      - name: Commit clean refinement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/refine-wip-motif-planner.yml tools/refine_wip_motif_planner.py
          git add wipple/accounting/wip.py tests/test_wip_motif_planner.py
          git commit -m "Short-circuit motif billing bridges"
          git push origin HEAD:wip-motif-planner
