name: Apply processing UI patch

on:
  push:
    branches: [simplify-processing-and-csv-timer]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simplify-processing-and-csv-timer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply UI changes
        run: python tools/apply_processing_ui_patch.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest scipy pillow reportlab
      - name: Run tests and corpus gates
        run: python -m pytest -q
      - name: Commit clean implementation
        run: |
          rm tools/apply_processing_ui_patch.py .github/workflows/apply-processing-ui-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify processing status and time CSV uploads"
          git push origin HEAD:simplify-processing-and-csv-timer
