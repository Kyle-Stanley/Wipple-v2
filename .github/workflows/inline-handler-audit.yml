name: Inline handler audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory inline HTML event attributes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          roots = [Path('static/index.html'), *Path('static').rglob('*.js')]
          attr = re.compile(r'\bon[a-z]+\s*=\s*(["\'])', re.I)
          findings = []
          for path in roots:
              if not path.exists():
                  continue
              lines = path.read_text(encoding='utf-8').splitlines()
              for number, line in enumerate(lines, 1):
                  matches = list(attr.finditer(line))
                  if not matches:
                      continue
                  findings.append({
                      'file': str(path),
                      'line': number,
                      'text': line.strip(),
                      'before': lines[number-2].strip() if number > 1 else '',
                      'after': lines[number].strip() if number < len(lines) else '',
                      'count': len(matches),
                  })
          print('INLINE_HANDLER_AUDIT_BEGIN')
          print(json.dumps(findings, indent=2))
          print('INLINE_HANDLER_AUDIT_END')
          print(f'Inline event attributes: {sum(item["count"] for item in findings)} across {len(findings)} lines')
          PY
