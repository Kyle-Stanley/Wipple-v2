name: Inspect upload timing
on:
  push:
    branches: [wip-motif-planner]
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture timing-related frontend code
        run: |
          {
            grep -n -E -C 8 'elapsed_seconds|api_calls|cost_usd|[Uu]pload time|metrics' static/index.html || true
            echo '--- ingest narration ---'
            grep -n -E -C 8 'Document split into|Spreadsheet cells read natively' server.py || true
          } > .ui-inspect.txt
      - name: Commit inspection output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ui-inspect.txt
          git commit -m 'Capture upload timing inspection' || exit 0
          git push
