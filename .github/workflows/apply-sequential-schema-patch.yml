name: apply sequential schema patch

on:
  push:
    branches:
      - optimize-validation-dedup-memo

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-validation-dedup-memo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply schema routing patch
        run: python tools/apply_sequential_schema_patch.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest scipy pillow reportlab
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Run corpus gates
        run: python -m wipple.support.gates
      - name: Remove patch scaffolding
        run: |
          rm tools/apply_sequential_schema_patch.py
          rm .github/workflows/apply-sequential-schema-patch.yml
      - name: Commit sequential routing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Run CC only when WIP is unresolved"
          git push origin HEAD:optimize-validation-dedup-memo
